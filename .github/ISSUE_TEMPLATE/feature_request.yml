name: 🎯 Feature Request
description: Propose a new feature, opportunity category, or plugin for Noria
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Noria better? We would love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe it.
      placeholder: A clear and concise description of the limitation...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or layout you would like to see implemented.
      placeholder: Describe how this would work and what files/interfaces are affected...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've thought of.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, visual diagrams, or mock screenshots about the request here.
