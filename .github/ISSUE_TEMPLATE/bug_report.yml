name:  [BUG]  Bug Report
description: Create a report to help us improve Noria
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the sections below to help us reproduce and resolve the issue fast.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the unexpected behavior...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What steps did you take to encounter this bug?
      placeholder: |
        1. Set up active pipelines in .env
        2. Run 'npm start'
        3. Emit Event...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Logs or Stack Trace
      description: Paste any relevant terminal stdout/stderr logs here.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Node.js version, OS, browser, etc.
      placeholder: Node v22.14.0 on Windows 11
    validations:
      required: true
